format = """
$directory$git_branch$git_status
$character"""
add_newline = false

[directory]
style = "blue"
truncation_length = 2

[git_branch]
symbol = " "
style = "green"

[git_status]
format = ' ([\($all_status\)]($style))'
style = "red"
conflicted = "⚔️ "
ahead = "↑${count}"
behind = "↓${count}"
diverged = "⇕↑${ahead_count}↓${behind_count}"
untracked = " ${count}"                      # or "??"
stashed = "📦"
modified = "✎ ${count}"
staged = "● ${count}"
renamed = "» ${count}"
deleted = "✖ ${count}"

[character]
success_symbol = "[> ](green)"
error_symbol = "[✗  ](red)"
